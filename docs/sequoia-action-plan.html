<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Action Plan — sequoia-service.ru — 27.05.2026</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --card-hover: #26344d;
            --text: #e2e8f0;
            --text-dim: #94a3b8;
            --accent: #38bdf8;
            --accent-dim: #0ea5e9;
            --urgent: #ef4444;
            --urgent-bg: rgba(239, 68, 68, 0.1);
            --high: #f59e0b;
            --high-bg: rgba(245, 158, 11, 0.1);
            --medium: #22c55e;
            --medium-bg: rgba(34, 197, 94, 0.1);
            --border: #334155;
            --code-bg: #0f172a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            padding: 20px;
        }
        .container { max-width: 900px; margin: 0 auto; }
        header {
            text-align: center;
            padding: 40px 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 30px;
        }
        h1 { font-size: 2rem; margin-bottom: 8px; color: var(--accent); }
        .subtitle { color: var(--text-dim); font-size: 1.1rem; }
        .progress-bar {
            width: 100%;
            height: 8px;
            background: var(--border);
            border-radius: 4px;
            margin: 20px 0;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--accent-dim));
            border-radius: 4px;
            transition: width 0.3s ease;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: var(--card);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid var(--border);
        }
        .stat-number { font-size: 2rem; font-weight: 700; color: var(--accent); }
        .stat-label { color: var(--text-dim); font-size: 0.9rem; margin-top: 5px; }
        .filters {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 25px;
            justify-content: center;
        }
        .filter-btn {
            padding: 8px 16px;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text);
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        .filter-btn:hover, .filter-btn.active {
            background: var(--accent);
            color: var(--bg);
            border-color: var(--accent);
        }
        .task-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            margin-bottom: 15px;
            overflow: hidden;
            transition: all 0.2s;
        }
        .task-card:hover { border-color: var(--accent); }
        .task-card.completed { opacity: 0.6; }
        .task-card.completed .task-title { text-decoration: line-through; color: var(--text-dim); }
        .task-header {
            padding: 20px;
            display: flex;
            align-items: flex-start;
            gap: 15px;
            cursor: pointer;
        }
        .checkbox {
            width: 24px;
            height: 24px;
            border: 2px solid var(--border);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 2px;
        }
        .checkbox:hover { border-color: var(--accent); }
        .checkbox.checked {
            background: var(--accent);
            border-color: var(--accent);
        }
        .checkbox.checked::after {
            content: '';
            width: 6px;
            height: 10px;
            border: solid var(--bg);
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
            margin-bottom: 2px;
        }
        .task-meta {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 8px;
        }
        .badge {
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .badge-urgent { background: var(--urgent-bg); color: var(--urgent); border: 1px solid var(--urgent); }
        .badge-high { background: var(--high-bg); color: var(--high); border: 1px solid var(--high); }
        .badge-medium { background: var(--medium-bg); color: var(--medium); border: 1px solid var(--medium); }
        .badge-phase { background: var(--card-hover); color: var(--text-dim); border: 1px solid var(--border); }
        .task-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }
        .task-content.open { max-height: 2000px; }
        .task-body {
            padding: 0 20px 20px 59px;
        }
        .step-list {
            list-style: none;
            counter-reset: step;
        }
        .step-list li {
            position: relative;
            padding-left: 40px;
            margin-bottom: 12px;
            padding-top: 2px;
        }
        .step-list li::before {
            counter-increment: step;
            content: counter(step);
            position: absolute;
            left: 0;
            top: 0;
            width: 28px;
            height: 28px;
            background: var(--accent);
            color: var(--bg);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: 700;
        }
        .note {
            background: var(--urgent-bg);
            border-left: 3px solid var(--urgent);
            padding: 12px 15px;
            border-radius: 0 8px 8px 0;
            margin: 15px 0;
            font-size: 0.95rem;
        }
        .tip {
            background: var(--medium-bg);
            border-left: 3px solid var(--medium);
            padding: 12px 15px;
            border-radius: 0 8px 8px 0;
            margin: 15px 0;
            font-size: 0.95rem;
        }
        code {
            background: var(--code-bg);
            padding: 2px 8px;
            border-radius: 4px;
            font-family: 'Fira Code', 'Consolas', monospace;
            font-size: 0.9rem;
            color: var(--accent);
            word-break: break-all;
        }
        pre {
            background: var(--code-bg);
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 10px 0;
            border: 1px solid var(--border);
        }
        pre code { padding: 0; background: none; }
        .expand-icon {
            margin-left: auto;
            transition: transform 0.2s;
            color: var(--text-dim);
            font-size: 1.2rem;
        }
        .expand-icon.open { transform: rotate(180deg); }
        .hidden { display: none !important; }
        footer {
            text-align: center;
            padding: 40px 0;
            color: var(--text-dim);
            border-top: 1px solid var(--border);
            margin-top: 40px;
        }
        @media (max-width: 600px) {
            body { padding: 10px; }
            h1 { font-size: 1.5rem; }
            .task-header { padding: 15px; }
            .task-body { padding: 0 15px 15px 54px; }
        }
    </style>
</head>

            },
            {
                id: 7,
                title: "Добавить JSON-LD Organization schema на spb",

        let completedTasks = JSON.parse(localStorage.getItem('sequoiaTasks') || '[]');

        function renderTasks(filter = 'all') {
            const container = document.getElementById('tasksContainer');
            container.innerHTML = '';

            tasks.forEach(task => {
                const isCompleted = completedTasks.includes(task.id);
                const shouldShow = filter === 'all' ||
                    (filter === 'completed' && isCompleted) ||
                    (filter === 'urgent' && task.priority === 'urgent' && !isCompleted) ||
                    (filter === 'week' && task.phase === 'Неделя' && !isCompleted) ||
                    (filter === 'month' && task.phase === 'Месяц' && !isCompleted);

                if (!shouldShow) return;

                const card = document.createElement('div');
                card.className = `task-card ${isCompleted ? 'completed' : ''}`;
                card.dataset.priority = task.priority;
                card.dataset.phase = task.phase;

                const priorityClass = task.priority === 'urgent' ? 'badge-urgent' :
                    task.priority === 'high' ? 'badge-high' : 'badge-medium';
                const priorityText = task.priority === 'urgent' ? 'Срочно' :
                    task.priority === 'high' ? 'Высокий' : 'Средний';

                card.innerHTML = `
                    <div class="task-header" onclick="toggleTask(${task.id})">
                        <div class="checkbox ${isCompleted ? 'checked' : ''}" onclick="event.stopPropagation(); toggleComplete(${task.id})"></div>
                        <div style="flex: 1;">
                            <div class="task-title" style="font-weight: 600; font-size: 1.05rem; margin-bottom: 4px;">${task.title}</div>
                            <div class="task-meta">
                                <span class="badge ${priorityClass}">${priorityText}</span>
                                <span class="badge badge-phase">${task.phase}</span>
                            </div>
                        </div>
                        <span class="expand-icon" id="expand-${task.id}">&#9662;</span>
                    </div>
                    <div class="task-content" id="content-${task.id}">
                        <div class="task-body">
                            <p style="color: var(--text-dim); margin-bottom: 15px;">${task.desc}</p>
                            ${task.note ? `<div class="note">${task.note}</div>` : ''}
                            <ol class="step-list">
                                ${task.steps.map(s => `<li>${s}</li>`).join('')}
                            </ol>
                        </div>
                    </div>
                `;

                container.appendChild(card);
            });

            updateProgress();
        }

        function toggleTask(id) {
            const content = document.getElementById(`content-${id}`);
            const expand = document.getElementById(`expand-${id}`);
            content.classList.toggle('open');
            expand.classList.toggle('open');
        }

        function toggleComplete(id) {
            const idx = completedTasks.indexOf(id);
            if (idx > -1) {
                completedTasks.splice(idx, 1);
            } else {
                completedTasks.push(id);
            }
            localStorage.setItem('sequoiaTasks', JSON.stringify(completedTasks));

            // Re-render with current filter
            const activeBtn = document.querySelector('.filter-btn.active');
            const filter = activeBtn ? activeBtn.dataset.filter : 'all';
            renderTasks(filter);
        }

        function filterTasks(filter) {
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.filter === filter);
            });
            renderTasks(filter);
        }

        function updateProgress() {
            const done = completedTasks.length;
            const total = tasks.length;
            const pct = Math.round((done / total) * 100);

            document.getElementById('statDone').textContent = done;
            document.getElementById('statProgress').textContent = pct + '%';
            document.getElementById('progressFill').style.width = pct + '%';
        }

        // Initial render
        renderTasks();
    </script>
</body>
</html>
